name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Strip sensitive/non-runtime files before syncing to the public Space.
      # This runs on the CI runner's throwaway checkout only — does NOT
      # alter the private GitHub repo.
      - name: Strip non-runtime files
        run: |
          rm -rf \
            docs/ \
            eval/ \
            tests/ \
            frontend/ \
            .claude/ \
            .vscode/ \
            .gradio/ \
            debug_prompt.txt \
            diag_result.json \
            MCGILL_AUDIT_INIT.md \
            SYSTEM_STATE_MACHINE.md \
            api_contract.md \
            REVIEW_REQUEST.md \
            test_cases.json \
            test_italic_manual.py \
            main.py

          # Strip data/ contents but keep the directory for runtime writes
          rm -f data/*.json data/*.docx
          touch data/.gitkeep

      - name: Sync to HF Space
        uses: huggingface/hub-sync@v1
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
          huggingface_repo_id: ${{ vars.HF_SPACE_ID }}
          github_repo_id: ${{ github.repository }}
