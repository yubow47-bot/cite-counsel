name: Sync to Hugging Face Space

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Strip sensitive/non-runtime files before syncing to the public Space.
      # This runs on the CI runner's throwaway checkout only — does NOT
      # alter the private GitHub repo.
      - name: Strip non-runtime files
        run: |
          rm -rf \
            docs/ \
            eval/ \
            tests/ \
            frontend/ \
            .claude/ \
            .vscode/ \
            .gradio/ \
            debug_prompt.txt \
            diag_result.json \
            MCGILL_AUDIT_INIT.md \
            SYSTEM_STATE_MACHINE.md \
            api_contract.md \
            REVIEW_REQUEST.md \
            test_cases.json \
            test_italic_manual.py \
            main.py

          # Strip data/ contents but keep the directory for runtime writes
          rm -f data/*.json data/*.docx
          touch data/.gitkeep

      # Upload the stripped local tree to HF Space via huggingface_hub Python API.
      # Using the Python API directly (not the deprecated huggingface-cli) ensures
      # reliable execution on all runner images regardless of PATH/console-script setup.
      # delete_patterns="*" makes this a true mirror (removes stale files on HF).
      # ignore_patterns prevents .git/ from being uploaded — the strip step removes
      # sensitive content from the working tree but does NOT remove .git/, and git
      # history would expose past-committed strategy/governance docs to the public Space.
      - name: Upload stripped tree to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          pip install -U huggingface_hub
          python - <<'PY'
import os
from huggingface_hub import upload_folder

upload_folder(
    folder_path=".",
    repo_id=os.environ["HF_SPACE_ID"],
    repo_type="space",
    token=os.environ["HF_TOKEN"],
    commit_message="Sync from GitHub main",
    ignore_patterns=[".git/*", ".github/*"],
    delete_patterns="*",
)
PY
